name: mobile (Flutter)

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Correr também os testes no emulador Android (integração + Maestro) e no simulador iOS"
        type: boolean
        default: false

jobs:
  unit-widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar as pastas de plataforma (não estão no repositório)
        run: flutter create --org com.testinglab --project-name testing_lab_app --platforms=android .
      - run: flutter pub get
      # Os avisos de depreciação (info) não falham o CI; erros e warnings falham.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  integration-android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration }}
    runs-on: ubuntu-latest
    needs: unit-widget
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.testinglab --project-name testing_lab_app --platforms=android .
      - run: flutter pub get
      - name: Activar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: mobile
          script: flutter test integration_test

  maestro-android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration }}
    runs-on: ubuntu-latest
    needs: unit-widget
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.testinglab --project-name testing_lab_app --platforms=android .
      - run: flutter pub get
      - name: Compilar o APK de debug
        run: flutter build apk --debug
      - name: Instalar o Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Activar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: mobile
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/login_and_transfer.yaml

  integration-ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration }}
    runs-on: macos-latest
    needs: unit-widget
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.testinglab --project-name testing_lab_app --platforms=ios .
      - run: flutter pub get
      - name: Arrancar um simulador de iPhone
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Teste de integração no simulador iOS
        run: flutter test integration_test -d "$UDID"
